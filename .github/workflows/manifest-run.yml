name: Manifest-driven Run (production)

on:
  push:
    paths:
      - '**/manifest.json'
      - 'tools/**/manifest.json'
  pull_request:
    paths:
      - '**/manifest.json'
      - 'tools/**/manifest.json'
  workflow_dispatch:
    inputs:
      diff_mode:
        description: "DIFF_MODE (report | gate)"
        required: false
        default: "report"
      pssa_mode:
        description: "PSSA_MODE (baseline | strict)"
        required: false
        default: "baseline"
      manifest_validation_mode:
        description: "MANIFEST_VALIDATION_MODE (baseline | strict)"
        required: false
        default: "baseline"
      trace_runbuilder:
        description: "Enable TraceRunBuilder in aggregator (true|false)"
        required: false
        default: "false"

env:
  # default retention values (days) can be overridden via workflow inputs or secrets later
  ARTIFACT_RETENTION_SUCCESS: 3
  ARTIFACT_RETENTION_FAILURE: 14
  PSSA_MODE: ${{ github.event.inputs.pssa_mode || 'baseline' }}
  MANIFEST_VALIDATION_MODE: ${{ github.event.inputs.manifest_validation_mode || 'baseline' }}
  # DIFF_MODE: 'report' = only upload diff; 'gate' = fail CI on regressions
  # Default mapped from workflow_dispatch input (or falls back to 'report')
  DIFF_MODE: ${{ github.event.inputs.diff_mode || 'report' }}

jobs:
  resolve-mode:
    name: resolve-mode
    runs-on: ubuntu-latest
    outputs:
      ci_mode: ${{ steps.resolve.outputs.ci_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (removed) per-manifest validation downloads belong in run-manifests job

      - name: Resolve CI Mode
        id: resolve
        run: |
          pwsh -NoProfile -File tools/ci/Resolve-CIMode.ps1

      - name: CI-mode consistency check (non-blocking)
        id: ci_mode_check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ciPath = Join-Path $env:GITHUB_WORKSPACE 'ci-mode.json'
          $ci = $null
          if (Test-Path $ciPath) {
            try { $ci = Get-Content $ciPath -Raw | ConvertFrom-Json -ErrorAction Stop } catch { $ci = $null }
          }
          $label1 = if ($ci -and $ci.Label) { $ci.Label } else { $null }
          $label2 = if ($env:CI_MODE_LABEL) { $env:CI_MODE_LABEL } else { $null }
          Write-Host "[ci-check] ci-mode.json label = $label1"
          Write-Host "[ci-check] env label = $label2"
          if ($label1 -and $label2 -and ($label1 -ne $label2)) {
            Write-Host "::warning::CI mode mismatch between ci-mode.json and CI_MODE_LABEL"
          }

  discover-manifests:
    name: discover-manifests
    needs: resolve-mode
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.set_manifests.outputs.manifests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find manifests and emit safe matrix
        id: set_manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Run the discovery helper which writes a discovery JSON into a run-scoped folder under .github/artifacts
          & 'tools/ci/discover-manifests.ps1' -OutDir '.github/artifacts' -RunId $env:GITHUB_RUN_ID
          $discPath = ".github/artifacts/$($env:GITHUB_RUN_ID)/discovery-manifests.json"
          if (-not (Test-Path $discPath)) { Write-Host "Found manifests: []"; "manifests=[]" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append; exit 0 }
          $json = Get-Content -Raw -Path $discPath
          Write-Host "Found manifests: $json"
          "manifests=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  check-manifests:
    name: check-manifests (hybrid)
    needs: discover-manifests
    runs-on: ubuntu-latest
    outputs:
      has_manifests: ${{ steps.check.outputs.has_manifests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check manifest presence (hybrid mode)
        id: check
        shell: pwsh
        run: |
          $m = '${{ needs.discover-manifests.outputs.manifests }}'
          Write-Host "MANIFESTS=$m"
          $has = 'false'
          if ($m -ne '[]') { $has = 'true' }
          if ($m -eq '[]') {
            if ('${{ github.event_name }}' -eq 'pull_request') {
              Write-Host "::warning::No manifests found (PR mode)"
            } elseif ('${{ github.ref }}' -eq 'refs/heads/main') {
              Write-Host "::error::No manifests found on main branch"
              exit 1
            } else {
              Write-Host "No manifests found (non-main branch)"
            }
          }
          "has_manifests=$has" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  lint-psa:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: pwsh-modules-${{ runner.os }}-pssa-1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # trust PSGallery if present
          Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted -ErrorAction SilentlyContinue

          # Ensure NuGet provider exists (common cause of Install-Module failures on fresh runners)
          if (-not (Get-PackageProvider -Name NuGet -ListAvailable -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Scope CurrentUser -Force
          }

          # Install + verify
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber -Repository PSGallery
          Import-Module PSScriptAnalyzer -Force
          Get-Module PSScriptAnalyzer -ListAvailable | Select-Object Name, Version, Path

      - name: Run PSScriptAnalyzer (CI mode respects PSSA_MODE)
        id: pssa
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outdir = '.github/artifacts'
          if (-not (Test-Path $outdir)) { New-Item -ItemType Directory -Path $outdir -Force | Out-Null }
          $res = Invoke-ScriptAnalyzer -Path 'tools/ci' -Recurse -ErrorAction SilentlyContinue
          $res | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $outdir 'pssa-results.json') -Encoding UTF8
          $errCount = ($res | Where-Object { $_.Severity -in @('Error','Critical') }).Count
          Write-Host "PSScriptAnalyzer found $errCount errors"
          if ($env:PSSA_MODE -eq 'strict' -and $errCount -gt 0) { Write-Host 'Failing due to PSScriptAnalyzer errors'; exit 1 }
          if ($env:PSSA_MODE -ne 'strict' -and $errCount -gt 0) { Write-Host 'PSScriptAnalyzer errors found (baseline mode)'; }

      - name: Upload PSScriptAnalyzer results
        uses: actions/upload-artifact@v4
        with:
          name: pssa-results
          path: .github/artifacts/pssa-results.json


  validate-manifests:
    name: validate-manifests
    needs: [discover-manifests, lint-psa, check-manifests]
    if: ${{ needs.check-manifests.outputs.has_manifests == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.discover-manifests.outputs.manifests) }}
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard discovery integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & 'tools/ci/tests/guard_discovery.ps1'

      - name: Restore manifest cache (per-run)
        if: false # temporarily disabled to avoid cache-related cancellations during validation
        id: manifest_cache
        uses: actions/cache@v4
        with:
          path: .github/cache_manifest/${{ matrix.runId }}
          key: manifest-cache-${{ matrix.runId }}-${{ matrix.hash }}

      - name: Validate manifest (enforce run dir)
        id: validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $m = '${{ matrix.path }}'
          $runId = '${{ matrix.runId }}'
          $staging = Join-Path (Get-Location).Path ".github/artifacts/$runId"
          if (-not (Test-Path $staging)) { New-Item -ItemType Directory -Path $staging -Force | Out-Null }

          $mode = '${{ env.MANIFEST_VALIDATION_MODE }}'
          Write-Host "[validate] Mode: $mode"
          $report = [ordered]@{ runId = $runId; manifest = $m; timestamp = (Get-Date).ToString('o'); status = 'ok'; errors = @() }
          $failed = $false
          try {
            & 'tools/ci/ci_validate_manifest.ps1' -ManifestPath $m -EnforceRunDir
          } catch {
            $msg = $_.Exception.Message -replace "`n"," " -replace "`r"," "
            # always emit an annotation so issues are visible in PRs even in baseline mode
            Write-Host "::error title=Manifest Validation Failed file=$m::${msg}"
            $report.status = 'failed'
            $report.errors += $msg
            $failed = $true
          }
          $report | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $staging 'validation-report.json') -Encoding UTF8
          # write a minimal metadata to preserve artifact contract
          $meta = [ordered]@{ runId = $runId; manifest = $m; timestamp = (Get-Date).ToString('o'); status = $report.status }
          $meta | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $staging 'metadata.json') -Encoding UTF8

          # mark cache-hit if present so downstream can act accordingly
          if ('${{ steps.manifest_cache.outputs.cache-hit }}' -eq 'true') { Set-Content -Path (Join-Path $staging 'skipped.flag') -Value 'cache-hit' -Encoding UTF8 }

          # Fail only when strict mode is configured. Baseline mode reports but does not block CI.
          if ($failed -and $mode -eq 'strict') {
            Write-Host "Failing due to strict manifest validation mode"
            exit 1
          } else {
            if ($failed) { Write-Host "Manifest validation failed (baseline mode): issues recorded in validation-report.json" }
            exit 0
          }

      - name: Upload validation report (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-report-${{ matrix.runId }}
          path: .github/artifacts/${{ matrix.runId }}/**

  run-manifests:
    name: run-manifest-${{ matrix.runId }}
    needs: [validate-manifests, discover-manifests, check-manifests]
    if: ${{ needs.check-manifests.outputs.has_manifests == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.discover-manifests.outputs.manifests) }}
    permissions:
      contents: read
      actions: read
      checks: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download per-manifest validation report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: pr-validation-report-${{ matrix.runId }}
          path: .github/artifacts/${{ matrix.runId }}
          if-no-files-found: warn

      - name: Restore manifest cache (per-run)
        if: false # temporarily disabled to avoid cache-related cancellations during run-manifest
        id: manifest_cache_run
        uses: actions/cache@v4
        with:
          path: .github/cache_manifest/${{ matrix.runId }}
          key: manifest-cache-${{ matrix.runId }}-${{ matrix.hash }}

      - name: Ensure artifact staging exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runId = '${{ matrix.runId }}'
          $staging = Join-Path (Get-Location).Path ".github/artifacts/$runId"
          if (-not (Test-Path $staging)) { New-Item -ItemType Directory -Path $staging -Force | Out-Null }

      - name: Run manifest (unless cached)
        id: run_manifest
        if: steps.manifest_cache_run.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $m = '${{ matrix.path }}'
          $runId = '${{ matrix.runId }}'
          $manifestDir = Split-Path -Parent $m
          Write-Host "=== Running manifest: $m ==="
          try {
            & 'tools/ci/run.ps1' -ManifestPath $m -EnforceRunDir
          } catch {
            $msg = $_.Exception.Message -replace "`n"," " -replace "\r"," "
            Write-Host "::error title=Manifest Execution Failed file=$m::${msg}"
            exit 1
          }

      - name: Collect run artifacts and step logs
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $m = '${{ matrix.path }}'
          $runId = '${{ matrix.runId }}'
          $manifestDir = Split-Path -Parent $m
          $staging = Join-Path (Get-Location).Path ".github/artifacts/$runId"
          if (-not (Test-Path $staging)) { New-Item -ItemType Directory -Path $staging -Force | Out-Null }

          # copy declared outputs
          $json = Get-Content $m -Raw | ConvertFrom-Json
          if ($null -ne $json.outputs -and $json.outputs.Count -gt 0) {
            foreach ($out in $json.outputs) {
              $p = Join-Path $manifestDir $out
              if (Test-Path $p) {
                $relative = $p.Substring((Resolve-Path $manifestDir).Path.Length).TrimStart([IO.Path]::DirectorySeparatorChar)
                $dest = Join-Path $staging $relative
                $destDir = Split-Path -Parent $dest
                if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }
                Copy-Item -Path $p -Destination $dest -Force
              }
            }
          }

          # copy metadata + validation report and steps logs
          $meta = Join-Path $manifestDir 'metadata.json'
          if (Test-Path $meta) { Copy-Item -Path $meta -Destination (Join-Path $staging 'metadata.json') -Force }
          $vre = Join-Path $manifestDir 'validation-report.json'
          if (Test-Path $vre) { Copy-Item -Path $vre -Destination (Join-Path $staging 'validation-report.json') -Force }
          $stepsDir = Join-Path $manifestDir 'steps'
          if (Test-Path $stepsDir) { Copy-Item -Path (Join-Path $stepsDir '*') -Destination (Join-Path $staging 'steps') -Recurse -Force -ErrorAction SilentlyContinue }

          # produce run-level status if missing
          $destMeta = Join-Path $staging 'metadata.json'
          if (-not (Test-Path $destMeta)) {
            $status = if ('${{ steps.run_manifest.outcome }}' -eq 'success') { 'success' } else { 'skipped' }
            $mm = [ordered]@{ runId = $runId; manifest = $m; timestamp = (Get-Date).ToString('o'); status = $status }
            $mm | ConvertTo-Json -Depth 5 | Set-Content -Path $destMeta -Encoding UTF8
          }

          # create a simple status file for aggregator
          $statusFile = Join-Path $staging 'status.txt'
          Set-Content -Path $statusFile -Value ((Get-Content $destMeta -Raw | ConvertFrom-Json).status) -Encoding UTF8

      - name: List staging directory (debug)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runId = '${{ matrix.runId }}'
          $staging = Join-Path (Get-Location).Path ".github/artifacts/$runId"
          Write-Host "=== Staging path: $staging ==="
          if (Test-Path $staging) {
            Write-Host "--- Recursive listing (short) ---"
            Get-ChildItem -Path $staging -Recurse -Force | ForEach-Object { Write-Host ($_.FullName) }

            Write-Host "--- Writing machine-readable listing to listing.json ---"
            Get-ChildItem -Path $staging -Recurse -Force | Select-Object FullName,Length,LastWriteTime | ConvertTo-Json -Depth 3 | Set-Content -Path (Join-Path $staging 'listing.json') -Encoding UTF8
          } else {
            Write-Host "Staging path does not exist"
          }
      - name: Upload run artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}-${{ matrix.runId }}
          path: .github/artifacts/${{ matrix.runId }}/**
          retention-days: ${{ env.ARTIFACT_RETENTION_FAILURE }}

      - name: Save manifest cache
        if: steps.manifest_cache_run.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .github/cache_manifest/${{ matrix.runId }}
          key: manifest-cache-${{ matrix.runId }}-${{ matrix.hash }}

  aggregate-results:
    name: aggregate-results
    needs: run-manifests
    if: always()
    runs-on: ubuntu-latest
    env:
      TRACE_RUN_BUILDER: ${{ github.event.inputs.trace_runbuilder }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug aggregator file
        if: always()
        shell: pwsh
        run: |
          Write-Host '--- AGGREGATOR FILE CHECK ---'
          Write-Host 'Listing:'
          ls -l tools/ci/aggregate-report.ps1 || echo 'aggregate-report.ps1 not found in tools/ci'
          Write-Host 'First 40 lines:'
          if (Test-Path tools/ci/aggregate-report.ps1) { Get-Content tools/ci/aggregate-report.ps1 -TotalCount 40 | ForEach-Object { Write-Host $_ } } else { Write-Host 'file missing' }

      - name: Aggregate results
        id: aggregate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $shouldWriteBaseline = ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -or $env:GITHUB_REF -eq 'refs/heads/main')
            $args = @('-ArtifactsDir','artifacts','-OutputJson','manifest-run-summary.json','-BaselinePath','.github/cache_manifest/pssa-baseline.json')
            # respect workflow_dispatch input to enable tracing in CI
            if ($env:TRACE_RUN_BUILDER -and $env:TRACE_RUN_BUILDER -eq 'true') { $args += '-TraceRunBuilder' }
            if ($shouldWriteBaseline) {
              Write-Host '[aggregate] Running aggregation and writing baseline'
              pwsh -NoProfile -File "${{ github.workspace }}/tools/ci/aggregate-report.ps1" $args -WriteBaseline
            } else {
              Write-Host '[aggregate] Running aggregation (no baseline write)'
              pwsh -NoProfile -File "${{ github.workspace }}/tools/ci/aggregate-report.ps1" $args
            }
          } catch {
            Write-Host "[aggregate] aggregator failed: $($_.Exception.Message)"
            Write-Host '[aggregate] Emitting empty run-record array to satisfy decision contract'
            # Contract: decision engine expects an array of run records. Emit an empty array on failure
            @() | ConvertTo-Json -Depth 10 | Set-Content -Path manifest-run-summary.json -Encoding UTF8
            if (-not (Test-Path 'manifest-run-diff.json')) { '{}' | Out-File -FilePath manifest-run-diff.json -Encoding utf8 }
          } finally {
            # Publish the exact filenames we want the uploader to send. Use GITHUB_OUTPUT for step outputs.
            if ($env:GITHUB_OUTPUT) {
              "summary=manifest-run-summary.json" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "diff=manifest-run-diff.json" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "decision=ci-decision.json" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            } else {
              Write-Host "[aggregate] GITHUB_OUTPUT not available; skipping step outputs"
            }
          }

      - name: Upload manifest diff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-run-diff
          path: manifest-run-diff.json

      # debug bundle moved below to capture ci-decision.json

      - name: CI Contract Test
        if: always()
        run: |
          pwsh -NoProfile -File tools/ci/tests/test_ci_contract.ps1

      - name: Run CI Decision Engine
        id: run_ci_decision
        if: always()
        shell: pwsh
        run: |
          & 'tools/ci/ci-decision.ps1' -SummaryPath 'manifest-run-summary.json' -DiffPath 'manifest-run-diff.json' -OutputPath 'ci-decision.json'

      - name: Upload debug bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-bundle
          path: |
            ${{ steps.aggregate.outputs.summary }}
            ${{ steps.aggregate.outputs.diff }}
            ${{ steps.aggregate.outputs.decision }}
          retention-days: 7
          if-no-files-found: warn

      - name: Enforce CI Decision
        id: enforce_ci_decision
        run: |
          pwsh -NoProfile -Command {
            $ErrorActionPreference = 'Stop'
            if (-not (Test-Path 'ci-decision.json')) { Write-Error 'ci-decision.json missing'; exit 1 }
            $d = Get-Content 'ci-decision.json' -Raw | ConvertFrom-Json -ErrorAction Stop
            Write-Host "[ci] decision=$($d.decision) reason=$($d.reason) mode=$($d.mode)"
            if ($d.decision -ne 'pass') {
              Write-Error "::error::CI failed via decision engine ($($d.reason))"
              exit 1
            }
            exit 0
          }

      - name: Comment PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'manifest-run-summary.json';
            if (!fs.existsSync(path)) return;
            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const marker = '<!-- manifest-run-summary -->';

            const pssa = summary.pssa || {};
            const newF = pssa.newFindings || 0;
            const existingF = pssa.existingFindings || 0;
            const resolvedF = pssa.resolvedFindings || 0;
            const topFiles = pssa.topFiles || [];

            const artifactsUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            let topFilesMd = 'None';
            if (topFiles.length > 0) {
              topFilesMd = topFiles.slice(0,3).map(f => `- ${f.file} (${f.count})`).join('\n');
            }

            const bodyContent = `### PSScriptAnalyzer Summary\n\n- 🆕 New: ${newF}\n- ⚠️ Existing: ${existingF}\n- ✅ Resolved: ${resolvedF}\n\nTop files:\n${topFilesMd}\n\nArtifacts: ${artifactsUrl}\n\n` +
              `### Manifest Run Summary\n\n**${summary.passed}** passed / **${summary.failed}** failed\n\nFailed runs: ${summary.failedRuns && summary.failedRuns.length ? summary.failedRuns.join(', ') : 'none'}`;

            const body = `${marker}\n${bodyContent}`;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Annotate PR with new PSScriptAnalyzer findings
        if: github.event_name == 'pull_request'
        run: |
          pwsh -NoProfile -Command {
            $ErrorActionPreference = 'Stop'
            $summaryPath = 'manifest-run-summary.json'
            if (-not (Test-Path $summaryPath)) { Write-Host 'No manifest summary found; skipping annotations'; exit 0 }
            $s = Get-Content $summaryPath -Raw | ConvertFrom-Json
            if (-not $s.pssa -or -not $s.pssa.newSamples) { Write-Host 'No new PSSA findings'; exit 0 }

            # build dedup key and cap
            $max = 50
            $seen = @{}
            $count = 0
            foreach ($f in $s.pssa.newSamples) {
              if ($count -ge $max) { break }
              $file = if ($f.ScriptName) { $f.ScriptName } elseif ($f.FileName) { $f.FileName } else { $null }
              $line = if ($f.Line) { [int]$f.Line } else { 1 }
              $rule = if ($f.RuleName) { $f.RuleName } elseif ($f.Rule) { $f.Rule } else { '' }
              $msg = if ($f.Message) { ($f.Message -replace "`n"," " -replace "\r"," ").Trim() } else { '' }
              if (-not $file) { continue }
              $key = "$file|$rule|$msg"
              if ($seen.ContainsKey($key)) { continue }
              $seen[$key] = $true

              # severity mapping
              $sev = if ($f.Severity) { $f.Severity } else { 'Warning' }
              if ($sev -in @('Information','Info')) { continue }
              $ann = 'warning'
              if ($sev -in @('Error','Critical')) { $ann = 'error' }

              # emit GitHub annotation
              Write-Host "::${ann} file=${file},line=${line},title=PSSA:${rule}::${msg}"
              $count++
            }
            Write-Host "Emitted $count annotations (capped at $max)"
          }
