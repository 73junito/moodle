name: Pester Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load CI mode
        shell: pwsh
        run: pwsh -NoProfile -File tools/ci/load-ci-mode.ps1

      - name: Validate no pwsh -Command usage
        shell: pwsh
        run: pwsh -NoProfile -File tools/ci/ci_validate_no_pwsh_command.ps1 -Root .

      - name: Validate no implicit report paths
        shell: pwsh
        run: pwsh -NoProfile -File tools/ci/ci_validate_no_implicit_paths.ps1 -Root .

      - name: Run Pester + export results
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $modulePath = Join-Path $PWD 'tools\AppLocker.PolicyCompiler.psm1'
          $testPath   = Join-Path $PWD 'tools\tests\PolicyCompiler.Tests.ps1'

          Import-Module $modulePath -Force

          # Run Pester once and persist results
          $result = Invoke-Pester -Path $testPath -Passthru -Output Detailed

          $failedTestNames = @()
          if ($null -ne $result.Tests) {
            $failedTestNames = @($result.Tests | Where-Object { $_.Result -eq 'Failed' } | ForEach-Object { $_.Name })
          }

          $resultSummary = [pscustomobject]@{
            Result             = $result.Result
            TotalCount         = $result.TotalCount
            PassedCount        = $result.PassedCount
            FailedCount        = $result.FailedCount
            SkippedCount       = $result.SkippedCount
            InconclusiveCount  = $result.InconclusiveCount
            NotRunCount        = $result.NotRunCount
            DurationSeconds    = if ($null -ne $result.Duration) { $result.Duration.TotalSeconds } else { $null }
            FailedTestNames    = $failedTestNames
          }

          $resultSummary | ConvertTo-Json -Depth 5 | Out-File pester-results.json -Encoding utf8

          Write-Host "Pester Summary: $($result.Result) - Total=$($result.TotalCount) Passed=$($result.PassedCount) Failed=$($result.FailedCount) Skipped=$($result.SkippedCount)"
          if ($result.FailedCount -gt 0) {
            Write-Host "FAILED: $($result.FailedCount) tests"
            exit 1
          }

      - name: Upload Pester artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: pester-results.json
