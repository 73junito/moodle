name: Pipeline Contract

on: [pull_request]

jobs:
  pipeline-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate pipeline (contract + compile)
        run: php tools/compile_wrapper.php
